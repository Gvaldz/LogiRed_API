basePath: /
definitions:
  controllers.AcceptProposalRequest:
    properties:
      idstatus:
        example: 1
        type: integer
    required:
    - idstatus
    type: object
  controllers.CreateProposalRequest:
    properties:
      comment:
        example: Puedo llevar
        type: string
      id_ride:
        example: 1
        type: integer
      idcar:
        example: 3
        type: integer
      price:
        example: 150.5
        type: number
    required:
    - id_ride
    - idcar
    - price
    type: object
  dto.CarResponse:
    properties:
      backview_image:
        type: string
      brand:
        type: string
      car_registration:
        type: string
      color:
        type: string
      frontview_image:
        type: string
      idcar:
        type: integer
      iduser:
        type: integer
      max_capacity:
        type: integer
      model:
        type: string
      plates_image:
        type: string
      space_image:
        type: string
    type: object
  dto.CreateRideRequest:
    properties:
      approx_weight:
        type: number
      date:
        type: string
      description:
        type: string
      destination_address:
        type: string
      destination_lat:
        type: number
      destination_lng:
        type: number
      distance_km:
        type: number
      hour:
        type: string
      origin_address:
        type: string
      origin_city:
        type: string
      origin_lat:
        type: number
      origin_lng:
        type: number
    type: object
  dto.CreateRideResponse:
    properties:
      message:
        type: string
      ride:
        $ref: '#/definitions/dto.RideResponse'
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      expires_at:
        type: integer
    type: object
  dto.RideResponse:
    properties:
      aproxweight:
        type: number
      date:
        type: string
      description:
        type: string
      destination_address:
        type: string
      destination_lat:
        type: number
      destination_lng:
        type: number
      distance_km:
        type: number
      hour:
        type: string
      idclient:
        type: integer
      iddriver:
        type: integer
      idride:
        type: integer
      idridestatus:
        type: integer
      origin_address:
        type: string
      origin_lat:
        type: number
      origin_lng:
        type: number
      origincity:
        type: string
    type: object
  entities.DriverInfo:
    properties:
      citywork:
        type: string
      rating:
        type: number
    type: object
  entities.User:
    properties:
      birthday:
        type: string
      email:
        type: string
      id:
        type: integer
      image_url:
        type: string
      lastname:
        type: string
      name:
        type: string
      numberphone:
        type: string
      password:
        type: string
      user_type:
        type: integer
    type: object
  entities.UserProfile:
    properties:
      birthdate:
        type: string
      driver_info:
        $ref: '#/definitions/entities.DriverInfo'
      email:
        type: string
      iduser:
        type: integer
      image_url:
        type: string
      lastname:
        type: string
      name:
        type: string
      number_phone:
        type: string
      user_type:
        type: integer
    type: object
host: api-logired.shop
info:
  contact: {}
  description: API para la plataforma móvl LogiRed
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: LogiRed API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica a un usuario y devuelve un token JWT
      parameters:
      - description: Credenciales
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: petición inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión
      tags:
      - auth
  /cars:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: lista de carros
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Obtener los vehículos del conductor autenticado
      tags:
      - cars
    post:
      consumes:
      - multipart/form-data
      description: Un conductor registra su carro
      parameters:
      - description: Placa
        in: formData
        name: car_registration
        required: true
        type: string
      - description: Marca
        in: formData
        name: brand
        required: true
        type: string
      - description: Modelo
        in: formData
        name: model
        required: true
        type: string
      - description: Color
        in: formData
        name: color
        required: true
        type: string
      - description: Capacidad máxima
        in: formData
        name: max_capacity
        required: true
        type: integer
      - description: Imagen frontal
        in: formData
        name: frontview_image
        type: file
      - description: Imagen trasera
        in: formData
        name: backview_image
        type: file
      - description: Imagen de placas
        in: formData
        name: plates_image
        type: file
      - description: Imagen del espacio
        in: formData
        name: space_image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CarResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Crear un nuevo vehículo
      tags:
      - cars
  /cars/{id}:
    delete:
      description: Solo el conductor propietario puede eliminar su carro
      parameters:
      - description: ID del carro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: carro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Eliminar un vehículo
      tags:
      - cars
    get:
      parameters:
      - description: ID del carro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: datos del carro
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: carro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener un vehículo por ID
      tags:
      - cars
    put:
      consumes:
      - multipart/form-data
      description: El conductor propietario puede actualizar los datos de su carro
        (incluye imágenes)
      parameters:
      - description: ID del carro
        in: path
        name: id
        required: true
        type: integer
      - description: Placa
        in: formData
        name: car_registration
        type: string
      - description: Marca
        in: formData
        name: brand
        type: string
      - description: Modelo
        in: formData
        name: model
        type: string
      - description: Color
        in: formData
        name: color
        type: string
      - description: Capacidad máxima
        in: formData
        name: max_capacity
        type: integer
      - description: Imagen frontal
        in: formData
        name: frontview_image
        type: file
      - description: Imagen trasera
        in: formData
        name: backview_image
        type: file
      - description: Imagen de placas
        in: formData
        name: plates_image
        type: file
      - description: Imagen del espacio
        in: formData
        name: space_image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: mensaje y carro actualizado
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error en los datos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: carro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Actualizar un vehículo
      tags:
      - cars
  /devices/token:
    put:
      consumes:
      - application/json
      description: Asocia un token FCM y nombre de dispositivo al usuario autenticado
      parameters:
      - description: Datos del dispositivo
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error en la solicitud
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Registrar dispositivo para notificaciones
      tags:
      - devices
  /proposals:
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos de la propuesta
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateProposalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Crear una propuesta
      tags:
      - proposals
  /proposals/{id}:
    delete:
      description: Solo el conductor propietario puede eliminar su propuesta
      parameters:
      - description: ID de la propuesta
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: propuesta no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Eliminar una propuesta
      tags:
      - proposals
    get:
      parameters:
      - description: ID de la propuesta
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: datos de la propuesta
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: propuesta no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener una propuesta por ID
      tags:
      - proposals
  /proposals/{id}/accept:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID de la propuesta
        in: path
        name: id
        required: true
        type: integer
      - description: Nuevo estado
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.AcceptProposalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Aceptar o rechazar una propuesta
      tags:
      - proposals
  /rides:
    post:
      consumes:
      - application/json
      description: Un cliente crea un viaje para transporte de paquetes
      parameters:
      - description: Datos del viaje
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRideRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateRideResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Crear un nuevo viaje
      tags:
      - rides
  /rides/{id}:
    get:
      description: Devuelve los detalles de un viaje específico
      parameters:
      - description: ID del viaje
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: datos del viaje
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: viaje no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener un viaje por ID
      tags:
      - rides
  /rides/{id}/status:
    put:
      consumes:
      - application/json
      description: Cambia el estado de un viaje (solo el cliente o conductor autorizado)
      parameters:
      - description: ID del viaje
        in: path
        name: id
        required: true
        type: integer
      - description: Nuevo estado
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error en la solicitud
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: viaje no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Actualizar estado de un viaje
      tags:
      - rides
  /rides/{idride}/proposals:
    get:
      parameters:
      - description: ID del viaje
        in: path
        name: idride
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: lista de propuestas
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener todas las propuestas de un viaje
      tags:
      - proposals
  /rides/city/{city}:
    get:
      description: Devuelve viajes activos (estado 6) en la ciudad especificada
      parameters:
      - description: Nombre de la ciudad
        in: path
        name: city
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: lista de viajes
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ciudad no especificada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener viajes disponibles por ciudad
      tags:
      - rides
  /rides/client:
    get:
      description: Devuelve todos los viajes solicitados por el cliente
      produces:
      - application/json
      responses:
        "200":
          description: lista de viajes
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Obtener viajes del cliente autenticado
      tags:
      - rides
  /rides/driver/me:
    get:
      description: Devuelve todos los viajes que el conductor ha aceptado
      produces:
      - application/json
      responses:
        "200":
          description: lista de viajes
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Obtener viajes asignados al conductor autenticado
      tags:
      - rides
  /rides/history:
    get:
      description: Devuelve viajes con estado 4 o 5 (historial) para el usuario autenticado
        (cliente o conductor)
      produces:
      - application/json
      responses:
        "200":
          description: lista de viajes históricos
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Obtener historial de viajes (completados o cancelados)
      tags:
      - rides
  /rides/status:
    get:
      parameters:
      - description: Estado (1-6)
        in: query
        name: idstatus
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: total, rides
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Obtener viajes por estado
      tags:
      - rides
  /users:
    get:
      description: Devuelve lista de usuarios (solo para administradores)
      produces:
      - application/json
      responses:
        "200":
          description: lista de usuarios
          schema:
            items:
              $ref: '#/definitions/entities.User'
            type: array
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: no autorizado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Obtener todos los usuarios (solo admin)
      tags:
      - users
    post:
      consumes:
      - multipart/form-data
      description: Crea una cuenta. Si user_type=1 (Cliente), solo requiere datos
        básicos. Si user_type=2 (Conductor), requiere además datos del vehículo y
        2 documentos obligatorios (Identificación Oficial y Licencia).
      parameters:
      - description: 'Tipo de usuario: 1=Cliente, 2=Conductor'
        in: formData
        name: user_type
        required: true
        type: integer
      - description: Nombre
        in: formData
        name: name
        required: true
        type: string
      - description: Apellido
        in: formData
        name: lastname
        required: true
        type: string
      - description: Correo electrónico
        in: formData
        name: email
        required: true
        type: string
      - description: Teléfono
        in: formData
        name: numberphone
        type: string
      - description: Fecha de nacimiento (YYYY-MM-DD)
        in: formData
        name: birthdate
        type: string
      - description: Contraseña
        in: formData
        name: password
        required: true
        type: string
      - description: Foto de perfil (Opcional)
        in: formData
        name: image
        type: file
      - description: Placa del vehículo (Requerido para conductor)
        in: formData
        name: car_registration
        type: string
      - description: Marca del vehículo (Requerido para conductor)
        in: formData
        name: brand
        type: string
      - description: Modelo del vehículo (Requerido para conductor)
        in: formData
        name: model
        type: string
      - description: Color del vehículo (Requerido para conductor)
        in: formData
        name: color
        type: string
      - description: Capacidad máxima (Requerido para conductor)
        in: formData
        name: max_capacity
        type: integer
      - description: Imagen frontal del carro (Requerido para conductor)
        in: formData
        name: frontview_image
        type: file
      - description: Imagen trasera del carro (Requerido para conductor)
        in: formData
        name: backview_image
        type: file
      - description: Imagen de las placas (Requerido para conductor)
        in: formData
        name: plates_image
        type: file
      - description: Imagen del baúl/espacio (Opcional)
        in: formData
        name: space_image
        type: file
      - description: 'Documento: Identificación Oficial (Requerido para conductor)'
        in: formData
        name: document_identificacion
        type: file
      - description: 'Documento: Licencia de conducir (Requerido para conductor)'
        in: formData
        name: document_licencia
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Usuario creado exitosamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Error en los datos (Faltan campos, archivos incorrectos, etc.)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error interno del servidor (BD o Storage)
          schema:
            additionalProperties: true
            type: object
      summary: Registrar un nuevo usuario (Cliente o Conductor)
      tags:
      - users
  /users/{id}:
    delete:
      description: Elimina la cuenta (solo admin o el propio usuario)
      parameters:
