basePath: /
definitions:
  controllers.AcceptProposalRequest:
    properties:
      idstatus:
        example: 1
        type: integer
    required:
    - idstatus
    type: object
  controllers.CreateProposalRequest:
    properties:
      comment:
        example: Puedo llevar
        type: string
      id_ride:
        example: 1
        type: integer
      price:
        example: 150.5
        type: number
    required:
    - id_ride
    - price
    type: object
  dto.CarResponse:
    properties:
      backview_image:
        type: string
      brand:
        type: string
      car_registration:
        type: string
      color:
        type: string
      frontview_image:
        type: string
      idcar:
        type: integer
      iduser:
        type: integer
      leftview_image:
        type: string
      max_capacity:
        type: integer
      model:
        type: string
      plates_image:
        type: string
      rightview_image:
        type: string
      space_image:
        type: string
    type: object
  dto.CreateRideRequest:
    properties:
      approx_weight:
        type: number
      date:
        type: string
      description:
        type: string
      destination_address:
        type: string
      destination_lat:
        type: number
      destination_lng:
        type: number
      distance_km:
        type: number
      hour:
        type: string
      origin_address:
        type: string
      origin_lat:
        type: number
      origin_lng:
        type: number
    type: object
  dto.CreateRideResponse:
    properties:
      message:
        type: string
      ride:
        $ref: '#/definitions/dto.RideResponse'
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      expires_at:
        type: integer
    type: object
  dto.RideResponse:
    properties:
      aproxweight:
        type: number
      date:
        type: string
      description:
        type: string
      destination_address:
        type: string
      destination_lat:
        type: number
      destination_lng:
        type: number
      distance_km:
        type: number
      hour:
        type: string
      idclient:
        type: integer
      iddriver:
        type: integer
      idride:
        type: integer
      idridestatus:
        type: integer
      origin_address:
        type: string
      origin_lat:
        type: number
      origin_lng:
        type: number
    type: object
  dto.UserResponse:
    properties:
      birthdate:
        type: string
      email:
        type: string
      iduser:
        type: integer
      image_url:
        type: string
      lastname:
        type: string
      name:
        type: string
      numberphone:
        type: string
      usertype:
        type: integer
    type: object
  entities.CarInfo:
    properties:
      back_view_image:
        type: string
      brand:
        type: string
      car_registration:
        type: string
      color:
        type: string
      front_view_image:
        type: string
      id:
        type: integer
      left_view_image:
        type: string
      max_capacity:
        type: integer
      model:
        type: string
      plates_image:
        type: string
      right_view_image:
        type: string
      spaces_image:
        type: string
    type: object
  entities.DriverInfo:
    properties:
      car:
        $ref: '#/definitions/entities.CarInfo'
      rating:
        type: number
    type: object
  entities.MyProfile:
    properties:
      birthdate:
        type: string
      car:
        $ref: '#/definitions/entities.CarInfo'
      email:
        type: string
      iduser:
        type: integer
      image_url:
        type: string
      lastname:
        type: string
      name:
        type: string
      number_phone:
        type: string
      rating:
        type: number
      total_trips:
        type: integer
      user_type:
        type: integer
    type: object
  entities.User:
    properties:
      birthday:
        type: string
      email:
        type: string
      id:
        type: integer
      image_url:
        type: string
      lastname:
        type: string
      name:
        type: string
      numberphone:
        type: string
      password:
        type: string
      user_type:
        type: integer
    type: object
  entities.UserProfile:
    properties:
      driver_info:
        $ref: '#/definitions/entities.DriverInfo'
      email:
        type: string
      iduser:
        type: integer
      image_url:
        type: string
      lastname:
        type: string
      name:
        type: string
      number_phone:
        type: string
      user_type:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para la plataforma móvil LogiRed
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: LogiRed API
  version: "1.0"
paths:
  /auth/google:
    post:
      consumes:
      - application/json
      description: Recibe un Firebase ID Token, lo valida y devuelve un JWT igual
        que /auth/login
      parameters:
      - description: Firebase ID Token
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: expires_at del token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: petición inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token de Google inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: usuario no registrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión con Google (Firebase)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica a un usuario y devuelve un token JWT
      parameters:
      - description: Credenciales
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: petición inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión
      tags:
      - auth
  /cars:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: lista de carros
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener los vehículos del conductor autenticado
      tags:
      - cars
    post:
      consumes:
      - multipart/form-data
      description: Un conductor registra su carro
      parameters:
      - description: Placa
        in: formData
        name: car_registration
        required: true
        type: string
      - description: Marca
        in: formData
        name: brand
        required: true
        type: string
      - description: Modelo
        in: formData
        name: model
        required: true
        type: string
      - description: Color
        in: formData
        name: color
        required: true
        type: string
      - description: Capacidad máxima
        in: formData
        name: max_capacity
        required: true
        type: integer
      - description: Imagen frontal
        in: formData
        name: frontview_image
        type: file
      - description: Imagen trasera
        in: formData
        name: backview_image
        type: file
      - description: Imagen lado izquierdo
        in: formData
        name: leftview_image
        type: file
      - description: Imagen lado derecho
        in: formData
        name: rightview_image
        type: file
      - description: Imagen del espacio de carga
        in: formData
        name: space_image
        type: file
      - description: Imagen de placas
        in: formData
        name: plates_image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CarResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Crear un nuevo vehículo
      tags:
      - cars
  /cars/{id}:
    delete:
      description: Solo el conductor propietario puede eliminar su carro
      parameters:
      - description: ID del carro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: carro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Eliminar un vehículo
      tags:
      - cars
    get:
      parameters:
      - description: ID del carro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: datos del carro
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: carro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener un vehículo por ID
      tags:
      - cars
    put:
      consumes:
      - multipart/form-data
      description: El conductor propietario puede actualizar los datos de su carro
        (incluye imágenes)
      parameters:
      - description: ID del carro
        in: path
        name: id
        required: true
        type: integer
      - description: Placa
        in: formData
        name: car_registration
        type: string
      - description: Marca
        in: formData
        name: brand
        type: string
      - description: Modelo
        in: formData
        name: model
        type: string
      - description: Color
        in: formData
        name: color
        type: string
      - description: Capacidad máxima
        in: formData
        name: max_capacity
        type: integer
      - description: Imagen frontal
        in: formData
        name: frontview_image
        type: file
      - description: Imagen trasera
        in: formData
        name: backview_image
        type: file
      - description: Imagen lado izquierdo
        in: formData
        name: leftview_image
        type: file
      - description: Imagen lado derecho
        in: formData
        name: rightview_image
        type: file
      - description: Imagen del espacio de carga
        in: formData
        name: space_image
        type: file
      - description: Imagen de placas
        in: formData
        name: plates_image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: mensaje y carro actualizado
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error en los datos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: carro no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Actualizar un vehículo
      tags:
      - cars
  /devices/token:
    put:
      consumes:
      - application/json
      description: Asocia un token FCM y nombre de dispositivo al usuario autenticado
      parameters:
      - description: Datos del dispositivo
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error en la solicitud
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Registrar dispositivo para notificaciones
      tags:
      - devices
  /drivers/{id}/stats:
    get:
      description: Devuelve estadísticas detalladas del conductor para machine learning
        (rating, viajes completados, cancelados, etc.)
      parameters:
      - description: ID del conductor
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: estadísticas del conductor
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: conductor no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener estadísticas del conductor
      tags:
      - drivers
  /proposals:
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos de la propuesta
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateProposalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Crear una propuesta
      tags:
      - proposals
  /proposals/{id}:
    delete:
      description: Solo el conductor propietario puede eliminar su propuesta
      parameters:
      - description: ID de la propuesta
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: propuesta no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Eliminar una propuesta
      tags:
      - proposals
    get:
      parameters:
      - description: ID de la propuesta
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: datos de la propuesta
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: propuesta no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener una propuesta por ID con datos del conductor y su vehículo
      tags:
      - proposals
  /proposals/{id}/accept:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID de la propuesta
        in: path
        name: id
        required: true
        type: integer
      - description: Nuevo estado
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.AcceptProposalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Aceptar o rechazar una propuesta
      tags:
      - proposals
  /proposals/client:
    get:
      description: Devuelve todas las propuestas de todos los viajes creados por el
        cliente logueado.
      produces:
      - application/json
      responses:
        "200":
          description: lista de propuestas
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener todas las propuestas recibidas por el cliente autenticado
      tags:
      - proposals
  /proposals/driver:
    get:
      description: Devuelve todas las propuestas enviadas por el conductor logueado.
      produces:
      - application/json
      responses:
        "200":
          description: lista de propuestas
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener propuestas del conductor autenticado
      tags:
      - proposals
  /proposals/ride/{idride}:
    get:
      parameters:
      - description: ID del viaje
        in: path
        name: idride
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: lista de propuestas
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: no eres el cliente del viaje
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener todas las propuestas de un viaje
      tags:
      - proposals
  /reviews:
    post:
      consumes:
      - application/json
      description: Un pasajero crea una reseña para un conductor
      parameters:
      - description: Datos de la reseña
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: mensaje y reseña creada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error en los datos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Crear una reseña
      tags:
      - reviews
  /reviews/{id}:
    put:
      consumes:
      - application/json
      description: El pasajero propietario puede editar su reseña (solo texto y rating)
      parameters:
      - description: ID de la reseña
        in: path
        name: id
        required: true
        type: integer
      - description: Datos a actualizar
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: mensaje de éxito
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error en la solicitud
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: reseña no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Actualizar una reseña
      tags:
      - reviews
  /reviews/driver/{id}:
    get:
      description: Devuelve las reseñas de un conductor específico (sin autenticación)
      parameters:
      - description: ID del conductor
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: lista de reseñas
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obtener reseñas de un conductor por ID (público)
      tags:
      - reviews
  /reviews/driver/me:
    get:
      description: Devuelve todas las reseñas del conductor actual (requiere autenticación)
      produces:
      - application/json
      responses:
        "200":
          description: lista de reseñas
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener reseñas del conductor autenticado
      tags:
      - reviews
  /reviews/passenger/me:
    get:
      description: Devuelve todas las reseñas escritas por el pasajero actual
      produces:
      - application/json
      responses:
        "200":
          description: lista de reseñas
          schema:
            additionalProperties: true
            type: object
        "401":
          description: no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Obtener reseñas del pasajero autenticado
      tags:
      - reviews
  /rides:
    post:
      consumes:
      - application/json
      description: Un cliente crea un viaje para transporte de paquetes
      parameters:
      - description: Datos del viaje
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRideRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
