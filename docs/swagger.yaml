  /ws/rides/{id}/publish:
    get:
      description: 'Endpoint para que el conductor inicie una conexión WebSocket y
        transmita su ubicación en un viaje en proceso. (Nota: Swagger UI no puede
        probar WebSockets interactivos).'
      parameters:
      - description: ID del viaje
        in: path
        name: id
        required: true
        type: integer
      - description: Token JWT de autenticación
        in: query
        name: token
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols (Conexión WebSocket establecida)
          schema:
            type: string
        "400":
          description: ID de viaje inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Token requerido o inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: No autorizado (viaje no en proceso o no eres el conductor)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Viaje no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Conectar WebSocket para publicar ubicación
      tags:
      - tracking
  /ws/rides/{id}/subscribe:
    get:
      description: 'Endpoint para que el cliente inicie una conexión WebSocket y reciba
        la ubicación del conductor en tiempo real. (Nota: Swagger UI no puede probar
        WebSockets interactivos).'
      parameters:
      - description: ID del viaje
        in: path
        name: id
        required: true
        type: integer
      - description: Token JWT de autenticación
        in: query
        name: token
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols (Conexión WebSocket establecida)
          schema:
            type: string
        "400":
          description: ID de viaje inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Token requerido o inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: No autorizado (viaje no en proceso o no eres el cliente)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Viaje no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Conectar WebSocket para recibir ubicación
      tags:
      - tracking
securityDefinitions:
  Bearer:
    description: Escribe "Bearer <token>" para autenticarte
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
